<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ХимБио</title>
<style>
:root{--bg:#fff;--tx:#4b4b4b;--bd:#e5e5e5;--mut:#afafaf;--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--r:#ff4b4b}
@media(prefers-color-scheme:dark){:root{--bg:#131f24;--tx:#dce6ea;--bd:#37464f;--mut:#6b7f88}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:800 16px Nunito,system-ui,sans-serif}
#app{max-width:520px;margin:auto;padding:0 16px 110px}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 4px 12px;font-size:18px;border-bottom:2px solid var(--bd)}
.fl{color:var(--mut)}.fl.on{color:#ff9600}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;padding:10px;border-radius:14px;border:2px solid var(--bd);border-bottom-width:4px;background:var(--bg);color:var(--mut);font-size:15px;text-transform:uppercase}
.tabs .on{border-color:var(--b);background:rgba(28,176,246,.15);color:var(--b)}
.warn{background:rgba(255,150,0,.15);color:#ff9600;border-radius:14px;padding:12px 14px;margin-bottom:6px}
.ban{border-radius:16px;padding:14px 16px;color:#fff;margin:24px 0 8px}
.ban small{opacity:.85;font-size:13px}.ban h2{margin:2px 0 0;font-size:21px}
.nd{display:block;width:72px;height:66px;border-radius:50%;border:0;font-size:28px;color:#fff;margin:34px auto 12px;position:relative}
.nd:active{transform:translateY(5px);box-shadow:none!important}
.nd.lk{background:#e5e5e5!important;box-shadow:0 6px 0 #b7b7b7!important;color:#afafaf;cursor:default}
.go{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:var(--bg);color:var(--g);border:2px solid var(--bd);border-radius:12px;padding:4px 10px;font-size:14px;white-space:nowrap;animation:bn 1s infinite alternate}
@keyframes bn{to{top:-46px}}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;background:var(--bg);border-top:2px solid var(--bd);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;font-size:28px;opacity:.45;padding:4px 14px;border-radius:12px}
.nav .on{opacity:1;background:rgba(28,176,246,.15)}
body.les .nav{display:none}
.lh{display:flex;align-items:center;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 0 6px}
.bar{flex:1;height:16px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .3s}
.x{background:none;border:0;font-size:26px;color:var(--mut)}
.q{font-size:24px;margin:24px 0}.rv{color:var(--b);font-size:13px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;background:var(--bg);color:var(--tx);font-size:17px}
.opt.sel{border-color:var(--b);background:rgba(28,176,246,.15);color:var(--b)}
.opt.ok{border-color:var(--g);background:rgba(88,204,2,.15);color:var(--g)}
.opt.no{border-color:var(--r);background:rgba(255,75,75,.15);color:var(--r)}
.opt.dn{opacity:.3;pointer-events:none}
.cols{display:flex;gap:12px}.cols>div{flex:1}
.shk{animation:sk .4s}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.in{width:100%;padding:14px;border:2px solid var(--bd);border-radius:16px;background:rgba(128,128,128,.1);color:var(--tx);font:inherit;font-size:18px}
#ft{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--bd);background:var(--bg)}
#ft.g{box-shadow:inset 0 0 0 999px rgba(88,204,2,.18);color:var(--g)}
#ft.r{box-shadow:inset 0 0 0 999px rgba(255,75,75,.18);color:var(--r)}
.btn{display:block;width:100%;max-width:488px;margin:auto;padding:15px;border:0;border-radius:16px;background:var(--g);box-shadow:0 4px 0 var(--gd);color:#fff;font-size:16px;text-transform:uppercase;letter-spacing:.8px}
.btn:disabled{background:var(--bd);box-shadow:0 4px 0 #b7b7b7;color:var(--mut)}
.btn.red{background:var(--r);box-shadow:0 4px 0 #ea2b2b}
.btn.gh{background:none;box-shadow:none;color:var(--b);margin-top:6px}
.ctr{text-align:center;padding-top:90px}.ctr .big{font-size:84px}.ctr h1{margin:10px 0}
.st{display:flex;gap:10px;justify-content:center;margin:24px 0}
.st div{flex:1;border:2px solid var(--bd);border-radius:14px;padding:10px 4px;font-size:20px}.st small{display:block;color:var(--mut);font-size:12px}
.card{border:2px solid var(--bd);border-radius:16px;padding:16px;margin:16px 0}
.wk{display:flex;justify-content:space-between;margin-top:12px;text-align:center;font-size:13px;color:var(--mut)}
.wk b{display:block;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--bd);color:#fff;margin-top:4px;font-size:16px}
.wk b.on{background:#ff9600}
.pb{height:14px;background:var(--bd);border-radius:8px;overflow:hidden;margin-top:8px}.pb i{display:block;height:100%;background:#ffc800}
.chip{display:inline-block;margin:5px;padding:10px 14px;border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;background:var(--bg);color:var(--tx);font-size:18px}
.chip.dn{opacity:.25;pointer-events:none}
.ans{min-height:72px;border-top:2px solid var(--bd);border-bottom:2px solid var(--bd);padding:6px 0;margin-bottom:20px}
.mod{margin:26px 0 -10px;color:var(--mut);font-size:14px;text-transform:uppercase;letter-spacing:1px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .btn{margin:8px 0}.btn.gld{background:#ffc800;box-shadow:0 4px 0 #e5a800;color:#7a5a00}
.ctr2{text-align:center;background:var(--bg);padding:24px;border-radius:24px;width:90%;max-width:380px}
.qc{display:flex;gap:14px;align-items:center}.cb{text-align:center}.cb small{display:block;font-size:11px;color:var(--mut)}.rd{display:block;color:var(--g);font-size:12px}
.shake{display:inline-block;animation:shk2 .5s infinite}@keyframes shk2{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.lid{transform-origin:15px 45px;transition:transform .5s}.lid.op{transform:rotate(-70deg)}
.glow{filter:drop-shadow(0 0 28px #ffc800)}
.pop{display:inline-block;animation:pop .6s}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.top span{cursor:pointer}.av{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;font-size:22px}.av.big{width:120px;height:120px;font-size:68px}
.qb{background:#8e69d0;color:#fff;border-radius:18px;padding:18px;margin-top:14px}.qb h2{margin:0 0 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;color:var(--mut)}
.cal b{display:block;width:34px;height:34px;line-height:34px;margin:auto;border-radius:50%;font-size:15px}.cal b.on{background:#ff9600;color:#fff}.cal b.td{outline:2px solid var(--b)}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--bd);margin:6px 4px}
.bd{display:inline-block;width:76px;text-align:center;margin:6px 2px;font-size:12px}.bd i{display:block;width:60px;height:60px;line-height:60px;margin:0 auto 4px;border-radius:50%;font-style:normal;font-size:30px;background:#ffc800}.bd.lk i{background:var(--bd);filter:grayscale(1);opacity:.5}
:root[data-th=light]{--bg:#fff;--tx:#4b4b4b;--bd:#e5e5e5;--mut:#afafaf}:root[data-th=dark]{--bg:#131f24;--tx:#dce6ea;--bd:#37464f;--mut:#6b7f88}
.el{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.e{border:2px solid var(--bd);border-bottom-width:4px;border-radius:12px;background:var(--bg);color:var(--tx);padding:6px 0;font:inherit;font-size:13px}.e b{display:block;font-size:20px}
.nd.cur::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:5px solid var(--rc);animation:pl 1.4s ease-in-out infinite}@keyframes pl{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.12);opacity:.15}}
.lst{border:2px solid var(--bd);border-radius:16px;overflow:hidden}.rw{padding:16px;border-bottom:2px solid var(--bd);display:flex;justify-content:space-between;align-items:center;cursor:pointer}.rw:last-child{border:0}
.sw{width:48px;height:28px;border-radius:14px;background:var(--bd);position:relative}.sw.on{background:#49c0f8}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}.sw.on::after{left:23px}
h3{margin:22px 0 10px}.noanim *{animation:none!important;transition:none!important}
.sb{position:fixed;left:16px;right:16px;max-width:488px;margin:0 auto;top:var(--th,62px);z-index:4}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:14px;z-index:40;max-width:85%;text-align:center}
.jb{position:fixed;right:16px;bottom:96px;width:56px;height:56px;border-radius:16px;border:2px solid var(--bd);border-bottom-width:4px;background:var(--bg);color:var(--b);font-size:28px;z-index:6}
.pw{position:relative}.pw input{padding-right:50px}.pw span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:22px;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<div class="nav"><button onclick="home()">🏠</button><button onclick="quests()">🧰</button><button onclick="league()">🏆</button><button onclick="feed()">💬</button><button onclick="shop()">💎</button><button onclick="more()">⋯</button></div><div id="pp"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
